<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artisanal Cafe & Bakery - Digital Menu Demo</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-dark: #2A1A14;
      --accent-gold: #C88A34;
      --accent-soft: #E8B974;
      --bg-cream: #FAF6F0;
      --card-bg: #FFFFFF;
      --text-main: #332219;
      --text-muted: #7A6B63;
      --veg-green: #2E7D32;
      --egg-amber: #D84315;
      --nonveg-red: #C62828;
      --shadow-sm: 0 4px 15px rgba(42, 26, 20, 0.05);
      --shadow-md: 0 8px 25px rgba(42, 26, 20, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      padding-bottom: 50px;
    }

    /* Container */
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg-cream);
    }

    /* Header Banner */
    .brand-header {
      background-color: var(--card-bg);
      padding: 24px 20px 18px 20px;
      text-align: center;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo-container {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 700;
      color: var(--primary-dark);
      letter-spacing: -0.5px;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Sample Generic Donut Icon replacing 'O' */
    .donut-icon {
      width: 26px;
      height: 26px;
      background: radial-gradient(circle, #5A3322 35%, #2A1A14 36%);
      border-radius: 50%;
      display: inline-block;
      position: relative;
      border: 2px solid var(--accent-gold);
      box-shadow: inset 0 0 4px rgba(0,0,0,0.4);
    }
    .donut-icon::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 8px; height: 8px;
      background-color: var(--card-bg);
      border-radius: 50%;
    }

    .brand-tagline {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3.5px;
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-top: 6px;
    }

    .demo-badge {
      display: inline-block;
      background: #FFF3E0;
      color: #E65100;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 1px solid #FFE0B2;
    }

    /* Search & Filters */
    .filter-section {
      padding: 16px 20px 8px 20px;
    }

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--card-bg);
      border: 1px solid rgba(200, 138, 52, 0.2);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 4px 12px rgba(200, 138, 52, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent-gold);
    }

    /* Diet Filter Buttons */
    .diet-filters {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .diet-btn {
      flex: 1;
      padding: 8px 12px;
      background: var(--card-bg);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .diet-btn.active {
      background: var(--primary-dark);
      color: #FFF;
      border-color: var(--primary-dark);
    }

    /* Category Nav Bar */
    .category-nav-wrapper {
      position: sticky;
      top: 105px;
      z-index: 90;
      background: var(--bg-cream);
      padding: 8px 20px 12px 20px;
    }

    .category-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 2px;
    }

    .category-nav::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      white-space: nowrap;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid rgba(200, 138, 52, 0.2);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-chip.active {
      background: var(--accent-gold);
      color: #FFF;
      border-color: var(--accent-gold);
      box-shadow: 0 4px 10px rgba(200, 138, 52, 0.3);
    }

    /* Menu Sections */
    .menu-container {
      padding: 0 20px;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-dark);
      margin: 20px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(200, 138, 52, 0.4), transparent);
    }

    /* Food Cards */
    .food-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      gap: 14px;
      align-items: center;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .food-card:active {
      transform: scale(0.98);
    }

    .food-img-wrapper {
      width: 90px;
      height: 90px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      background: #F3ECE1;
    }

    .food-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .food-details {
      flex: 1;
    }

    .food-header {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 4px;
    }

    /* Diet Icons */
    .diet-icon {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .diet-icon.veg {
      border: 1.5px solid var(--veg-green);
    }
    .diet-icon.veg::after {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--veg-green);
    }

    .diet-icon.egg {
      border: 1.5px solid var(--egg-amber);
    }
    .diet-icon.egg::after {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--egg-amber);
    }

    .diet-icon.nonveg {
      border: 1.5px solid var(--nonveg-red);
    }
    .diet-icon.nonveg::after {
      content: '';
      width: 0; height: 0;
      border-left: 3px solid transparent;
      border-right: 3px solid transparent;
      border-bottom: 6px solid var(--nonveg-red);
    }

    .food-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-dark);
      line-height: 1.25;
    }

    .food-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .food-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-gold);
    }

    /* Lightbox Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-close {
      position: absolute;
      top: 12px; right: 12px;
      width: 32px; height: 32px;
      background: rgba(0,0,0,0.5);
      color: #FFF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      z-index: 10;
      border: none;
    }

    .modal-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .modal-body {
      padding: 18px;
    }

    .modal-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .modal-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 10px;
    }

    .modal-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Footer Banner */
    .demo-footer {
      text-align: center;
      padding: 24px 20px;
      margin-top: 30px;
      border-top: 1px dashed rgba(200, 138, 52, 0.3);
      color: var(--text-muted);
      font-size: 12px;
    }

    .demo-footer p {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Brand Header -->
    <header class="brand-header">
      <div class="brand-logo-container">
        <div class="brand-logo-title">
          c<span class="donut-icon"></span>fe
        </div>
        <div class="brand-tagline">ARTISANAL BAKERY & COFFEE</div>
      </div>
      <div>
        <span class="demo-badge">Interactive QR Menu Demo</span>
      </div>
    </header>

    <!-- Search and Diet Filters -->
    <div class="filter-section">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search delicacies, donuts, cakes...">
      </div>

      <div class="diet-filters">
        <button class="diet-btn active" data-diet="all">All Items</button>
        <button class="diet-btn" data-diet="veg">
          <span class="diet-icon veg"></span> Veg
        </button>
        <button class="diet-btn" data-diet="egg">
          <span class="diet-icon egg"></span> Egg
        </button>
      </div>
    </div>

    <!-- Category Nav Pills -->
    <div class="category-nav-wrapper">
      <div class="category-nav" id="categoryNav">
        <button class="cat-chip active" data-cat="all">All Categories</button>
        <button class="cat-chip" data-cat="donuts">Brioche Donuts</button>
        <button class="cat-chip" data-cat="cheesecakes">Cheesecakes</button>
        <button class="cat-chip" data-cat="cakes">Cakes</button>
        <button class="cat-chip" data-cat="savoury">Savoury Treats</button>
      </div>
    </div>

    <!-- Menu Items List -->
    <div class="menu-container" id="menuContainer">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Demo Footer -->
    <footer class="demo-footer">
      <p><strong>Sample Digital Menu Preview</strong></p>
      <p>Clean layout • Fast QR scanning • Mobile optimized</p>
    </footer>

  </div>

  <!-- Lightbox Modal -->
  <div class="modal-overlay" id="imageModal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <img src="" id="modalImg" class="modal-img" alt="Item Image">
      <div class="modal-body">
        <div class="modal-title-row">
          <span class="diet-icon" id="modalDiet"></span>
          <h3 class="modal-title" id="modalTitle"></h3>
        </div>
        <div class="modal-price" id="modalPrice"></div>
        <p class="modal-desc" id="modalDesc"></p>
      </div>
    </div>
  </div>

  <script>
    // Sample Generic Menu Items Data
    const menuItems = [
      {
        id: "d1",
        name: "Classic Chocolate Glazed Donut",
        category: "donuts",
        price: "₹140",
        diet: "egg",
        desc: "Fluffy artisanal brioche donut dipped in rich dark chocolate glaze.",
        image: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "d2",
        name: "Salted Caramel Custard Donut",
        category: "donuts",
        price: "₹180",
        diet: "egg",
        desc: "Stuffed with rich caramel custard and topped with sea salt caramel drizzles.",
        image: "https://images.unsplash.com/photo-1527515637462-cff94eecc1ac?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "c1",
        name: "Basque Burnt Cheesecake",
        category: "cheesecakes",
        price: "₹190",
        diet: "egg",
        desc: "Creamy crustless cheesecake baked to perfection with a caramelized top.",
        image: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "c2",
        name: "Blueberry New York Cheesecake",
        category: "cheesecakes",
        price: "₹220",
        diet: "veg",
        desc: "Rich eggless cheesecake topped with fresh house-made blueberry compote.",
        image: "https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "k1",
        name: "Belgian Chocolate Truffle Cake",
        category: "cakes",
        price: "₹750 / 500g",
        diet: "veg",
        desc: "Moist chocolate sponge layered with 55% Belgian chocolate ganache.",
        image: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "k2",
        name: "Red Velvet Cream Cheese Cake",
        category: "cakes",
        price: "₹800 / 500g",
        diet: "egg",
        desc: "Classic crimson velvet layers with silky whipped cream cheese frosting.",
        image: "https://images.unsplash.com/photo-1616541823729-00fe0aacd32c?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "s1",
        name: "Korean Garlic Butter Bun",
        category: "savoury",
        price: "₹200",
        diet: "veg",
        desc: "Soft pull-apart brioche stuffed with garlic cream cheese and herb butter.",
        image: "https://images.unsplash.com/photo-1608198093002-ad4e005484ec?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "s2",
        name: "Spinach & Corn Tart Quiche",
        category: "savoury",
        price: "₹165",
        diet: "veg",
        desc: "Savory buttery pastry shell filled with creamy spinach and sweet corn.",
        image: "https://images.unsplash.com/photo-1554306274-f23873d9a26c?auto=format&fit=crop&w=600&q=80"
      }
    ];

    const categoryNames = {
      donuts: "Brioche Donuts",
      cheesecakes: "Cheesecakes",
      cakes: "Cakes",
      savoury: "Savoury Treats"
    };

    let activeCategory = "all";
    let activeDiet = "all";
    let searchQuery = "";

    function renderMenu() {
      const container = document.getElementById('menuContainer');
      container.innerHTML = "";

      const filtered = menuItems.filter(item => {
        const matchesCat = activeCategory === "all" || item.category === activeCategory;
        const matchesDiet = activeDiet === "all" || item.diet === activeDiet;
        const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              item.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesDiet && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="no-results">No delicious items match your search.</div>`;
        return;
      }

      // Group by Category if "all" is selected
      const categoriesToRender = activeCategory === "all" 
        ? [...new Set(filtered.map(i => i.category))]
        : [activeCategory];

      categoriesToRender.forEach(cat => {
        const catItems = filtered.filter(i => i.category === cat);
        if (catItems.length === 0) return;

        const section = document.createElement('div');
        section.innerHTML = `
          <h2 class="section-title">${categoryNames[cat] || cat}</h2>
          <div class="cards-list"></div>
        `;

        const cardsList = section.querySelector('.cards-list');

        catItems.forEach(item => {
          const card = document.createElement('div');
          card.className = "food-card";
          card.onclick = () => openModal(item);
          card.innerHTML = `
            <div class="food-img-wrapper">
              <img src="${item.image}" class="food-img" alt="${item.name}" loading="lazy">
            </div>
            <div class="food-details">
              <div class="food-header">
                <span class="diet-icon ${item.diet}"></span>
                <div class="food-name">${item.name}</div>
              </div>
              <div class="food-desc">${item.desc}</div>
              <div class="food-price">${item.price}</div>
            </div>
          `;
          cardsList.appendChild(card);
        });

        container.appendChild(section);
      });
    }

    // Modal logic
    function openModal(item) {
      document.getElementById('modalImg').src = item.image;
      document.getElementById('modalTitle').innerText = item.name;
      document.getElementById('modalPrice').innerText = item.price;
      document.getElementById('modalDesc').innerText = item.desc;
      
      const dietIcon = document.getElementById('modalDiet');
      dietIcon.className = `diet-icon ${item.diet}`;

      document.getElementById('imageModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    // Search and Filter Listeners
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderMenu();
    });

    document.querySelectorAll('.cat-chip').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeCategory = e.target.getAttribute('data-cat');
        renderMenu();
      });
    });

    document.querySelectorAll('.diet-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.diet-btn').forEach(b => b.classList.remove('active'));
        const target = e.currentTarget;
        target.classList.add('active');
        activeDiet = target.getAttribute('data-diet');
        renderMenu();
      });
    });

    // Initial render
    renderMenu();
  </script>
</body>
</html>
